name: build dlgmemor framework

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: select xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: build dlgmemor target
      run: |
        WORKSPACE_PATH=$(find . -name "DLGMemor.xcworkspace" | head -n 1)
        echo "found workspace at: $WORKSPACE_PATH"
        xcodebuild build \
          -workspace "$WORKSPACE_PATH" \
          -scheme DLGMemor \
          -sdk iphoneos \
          -configuration Release \
          IPHONEOS_DEPLOYMENT_TARGET=14.0 \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

    - name: package build artifacts
      run: |
        FRAMEWORK_PATH=$(find . -name "DLGMemor.framework" -type d | head -n 1)
        mkdir -p output
        cp -R "$FRAMEWORK_PATH" output/
        cd output
        zip -r DLGMemor.framework.zip DLGMemor.framework

    - name: upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DLGMemor.framework
        path: output/DLGMemor.framework.zip
