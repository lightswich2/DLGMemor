name: build dlgmemor framework

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: select xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: build dlgmemor target
      run: |
        WORKSPACE_PATH=$(find . -name "DLGMemor.xcworkspace" | head -n 1)
        echo "found workspace at: $WORKSPACE_PATH"
        xcodebuild build \
          -workspace "$WORKSPACE_PATH" \
          -scheme DLGMemor \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath ./build \
          IPHONEOS_DEPLOYMENT_TARGET=14.0 \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          SUPPORTS_TEXT_BASED_API=NO \
          EAGER_LINKING=NO \
          MACH_O_TYPE=mh_dylib

    - name: package dylib artifact
      run: |
        # target the Products directory specifically to bypass EagerLinkingTBDs
        FRAMEWORK_PATH=$(find ./build/Build/Products -name "DLGMemor.framework" -type d | head -n 1)
        echo "found framework at: $FRAMEWORK_PATH"
        
        mkdir -p output
        cp "$FRAMEWORK_PATH/DLGMemor" output/DLGMemor.dylib
        
        echo "dylib extracted to output/DLGMemor.dylib"

    - name: upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DLGMemor.dylib
        path: output/DLGMemor.dylib
